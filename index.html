<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>عماد افندي | EMAD AFANDI — ادفع بسرعة وسهولة</title>
<meta name="description" content="صفحة عماد افندي الرسمية: الدفع InstaPay وفودافون كاش، المنيو، تقييم جوجل، اللوكيشن، السوشيال — كل حاجة في مكان واحد." />
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/png" href="./assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-pattern"></div>

<main class="phone">
  <!-- HERO -->
  <header class="hero reveal">
    <div class="logo-wrap">
      <!-- اللوجو الأصلي: assets/logo.png -->
      <div class="logo-shine">
        <div class="logo-glow"></div>
        <img src="./assets/logo.png" alt="عماد افندي" class="logo-alone" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex'" />
        <div id="logoFallback" class="logo-fallback-alone" style="display:none">
          <span class="logo-ar">عماد افندي</span>
          <span class="logo-en">EMAD AFANDI</span>
        </div>
      </div>
    </div>
    <h1 class="brand">عماد افندي</h1>
    <p class="brand-en">EMAD AFANDI</p>
  </header>

  <!-- PAYMENT -->
  <section class="card card-flat reveal" style="--d:.12s">
    <div class="pay" id="payInstapay">
      <div class="pay-icon" style="background:#fff"><img src="./assets/instapay.png" alt="InstaPay" /></div>
      <div class="pay-info">
        <strong>InstaPay</strong>
        <span class="pay-hint">ادفع على لينك ibrahim.attiyan</span>
      </div>
      <div class="pay-actions">
        <a class="mini ghost btn-open" data-link="instapay" href="#" target="_blank" rel="noopener">فتح</a>
      </div>
    </div>

    <div class="pay" id="payVoda">
      <div class="pay-icon voda"><svg viewBox="0 0 24 24" width="28" height="28" fill="#fff"><path d="M12 0A12 12 0 0 0 0 12A12 12 0 0 0 12 24A12 12 0 0 0 24 12A12 12 0 0 0 12 0M16.25 1.12C16.57 1.12 16.9 1.15 17.11 1.22C14.94 1.67 13.21 3.69 13.22 6C13.22 6.05 13.22 6.11 13.23 6.17C16.87 7.06 18.5 9.25 18.5 12.28C18.54 15.31 16.14 18.64 12.09 18.65C8.82 18.66 5.41 15.86 5.39 11.37C5.38 8.4 7 5.54 9.04 3.85C11.04 2.19 13.77 1.13 16.25 1.12Z"/></svg></div>
      <div class="pay-info">
        <strong>Vodafone Cash</strong>
        <span class="pay-hint">ادفع على محفظة فودافون كاش</span>
      </div>
      <div class="pay-actions">
        <a class="mini ghost btn-open" data-link="vodafone" href="#" target="_blank" rel="noopener">فتح</a>
      </div>
    </div>

  </section>

  <!-- ESSENTIALS -->
  <section class="card card-flat reveal" style="--d:.16s">
    <div class="social-grid">
      <a class="soc" data-link="maps" href="#" target="_blank" rel="noopener">
        <div class="soc-top"><img class="soc-logo" src="./assets/google-maps.svg" alt="Location" /></div><span>Location</span>
      </a>
      <a class="soc" data-link="menu" href="#" target="_blank" rel="noopener">
        <div class="soc-top"><img class="soc-logo-menu" src="./assets/logo-circle.png" alt="Menu" /></div><span>Menu</span>
      </a>
      <a class="soc" data-link="review" href="#" target="_blank" rel="noopener">
        <div class="soc-top"><img class="soc-logo" src="./assets/google-g.svg" alt="Google" /><span class="stars-row">★★★★★</span></div><span>Google Review</span>
      </a>
    </div>
  </section>

  <!-- SOCIAL -->
  <section class="card card-flat reveal" style="--d:.32s">
    <div class="social-grid">
      <a data-link="whatsapp" href="#" target="_blank" rel="noopener" class="soc">
        <div class="soc-top"><svg viewBox="0 0 24 24" width="26" height="26" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></div>
        <span>WhatsApp</span>
      </a>
      <a data-link="facebook" href="#" target="_blank" rel="noopener" class="soc">
        <div class="soc-top"><img src="./assets/facebook.svg" alt="Facebook" /></div>
        <span>Facebook</span>
      </a>
      <a data-link="instagram" href="#" target="_blank" rel="noopener" class="soc">
        <div class="soc-top"><img src="./assets/instagram.svg" alt="Instagram" /></div>
        <span>Instagram</span>
      </a>
    </div>
  </section>

</main>

<div id="toast" class="toast">اتنسخ ✅</div>
<script src="./links.js"></script>
<script src="./app.js"></script>
</body>
</html>
